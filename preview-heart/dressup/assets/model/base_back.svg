    <!-- torso + hips -->
    <path d="M230 180 C210 210 205 235 205 255 C205 285 220 305 250 320 L250 360 C250 420 235 470 215 510 C200 545 190 585 190 625 C190 705 235 750 290 750 C310 750 325 742 330 730 C335 742 350 750 370 750 C425 750 470 705 470 625 C470 585 460 545 445 510 C425 470 410 420 410 360 L410 320 C440 305 455 285 455 255 C455 235 450 210 430 180 Z"/>

    <!-- arms (back) -->
    <path d="M250 320 C210 325 170 355 150 400 C135 435 140 470 160 505 C175 530 195 545 220 548"/>
    <path d="M410 320 C450 325 490 355 510 400 C525 435 520 470 500 505 C485 530 465 545 440 548"/>

    <!-- shoulder blade hint -->
    <path d="M260 245 C285 230 315 230 340 245" fill="none" stroke="#cfcfcf" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- subtle back marker text -->
  <text x="300" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="14" fill="#9e9e9e" opacity="0.65">BACK</text>
</svg>
