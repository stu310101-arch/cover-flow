<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="skin" x1="0" y1="60" x2="0" y2="760">
      <stop offset="0" stop-color="#f8efe6"/>
      <stop offset="0.55" stop-color="#f2e2d4"/>
      <stop offset="1" stop-color="#ecd3c2"/>
    </linearGradient>
    <linearGradient id="sideShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b88f78" stop-opacity="0.35"/>
      <stop offset="0.32" stop-color="#b88f78" stop-opacity="0"/>
      <stop offset="0.68" stop-color="#b88f78" stop-opacity="0"/>
      <stop offset="1" stop-color="#b88f78" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="faceShade" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#b88f78" stop-opacity="0.22"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="40" x2="0" y2="220">
      <stop offset="0" stop-color="#3a2c25"/>
      <stop offset="1" stop-color="#16110f"/>
    </linearGradient>
  </defs>

  <g stroke="#b8aca2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- hair (simple but less "geometric") -->
    <path d="M242 138 C232 88 260 46 300 46 C344 46 372 88 360 146 C352 118 331 98 300 98 C269 98 248 118 242 138 Z" fill="url(#hair)" stroke="none"/>
    <path d="M260 104 C270 86 286 78 300 78 C314 78 330 86 340 104 C328 96 315 92 300 92 C285 92 272 96 260 104 Z" fill="#2b211c" opacity="0.8" stroke="none"/>

    <!-- head / face -->
    <path d="M300 60 C338 60 364 92 364 130 C364 169 344 198 317 209 C309 212 291 212 283 209 C256 198 236 169 236 130 C236 92 262 60 300 60 Z" fill="url(#skin)"/>
    <path d="M300 60 C338 60 364 92 364 130 C364 169 344 198 317 209 C309 212 291 212 283 209 C256 198 236 169 236 130 C236 92 262 60 300 60 Z" fill="url(#faceShade)" stroke="none"/>

    <!-- ears -->
    <path d="M236 135 C225 134 218 145 220 158 C222 169 232 176 242 171" fill="url(#skin)"/>
    <path d="M364 135 C375 134 382 145 380 158 C378 169 368 176 358 171" fill="url(#skin)"/>

    <!-- neck shadow / chin -->
    <path d="M276 206 C286 224 314 224 324 206 C316 214 308 218 300 218 C292 218 284 214 276 206 Z" fill="#b88f78" opacity="0.22" stroke="none"/>

    <!-- body (keep original proportions so existing clothing still fits) -->
    <path d="M230 180 C210 210 205 235 205 255 C205 285 220 305 250 320 L250 360 C250 420 235 470 215 510 C200 545 190 585 190 625 C190 705 235 750 290 750 C310 750 325 742 330 730 C335 742 350 750 370 750 C425 750 470 705 470 625 C470 585 460 545 445 510 C425 470 410 420 410 360 L410 320 C440 305 455 285 455 255 C455 235 450 210 430 180 Z" fill="url(#skin)"/>
    <path d="M230 180 C210 210 205 235 205 255 C205 285 220 305 250 320 L250 360 C250 420 235 470 215 510 C200 545 190 585 190 625 C190 705 235 750 290 750 C310 750 325 742 330 730 C335 742 350 750 370 750 C425 750 470 705 470 625 C470 585 460 545 445 510 C425 470 410 420 410 360 L410 320 C440 305 455 285 455 255 C455 235 450 210 430 180 Z" fill="url(#sideShade)" stroke="none" opacity="0.9"/>

    <!-- arms as closed shapes (read better than single-stroke curves) -->
    <path d="M252 320 C210 330 178 360 160 404 C146 438 152 472 172 506 C186 530 205 545 228 549 C241 551 252 542 255 530 C238 522 224 506 214 482 C200 450 202 420 214 394 C228 364 250 354 272 351 C265 340 258 330 252 320 Z" fill="url(#skin)"/>
    <path d="M408 320 C450 330 482 360 500 404 C514 438 508 472 488 506 C474 530 455 545 432 549 C419 551 408 542 405 530 C422 522 436 506 446 482 C460 450 458 420 446 394 C432 364 410 354 388 351 C395 340 402 330 408 320 Z" fill="url(#skin)"/>

    <!-- subtle anatomy hints -->
    <path d="M258 260 C282 244 318 244 342 260" fill="none" stroke="#c9bbb0" stroke-width="2" opacity="0.85"/>
    <path d="M285 430 C294 440 306 440 315 430" fill="none" stroke="#c9bbb0" stroke-width="2" opacity="0.55"/>
    <path d="M270 610 C282 598 294 596 300 596 C306 596 318 598 330 610" fill="none" stroke="#c9bbb0" stroke-width="2" opacity="0.35"/>

    <!-- face details -->
    <g fill="none" stroke="#6b5c52" stroke-width="3" opacity="0.7" stroke-linecap="round">
      <path d="M272 122 C282 114 292 114 302 122" opacity="0.55"/>
      <path d="M298 122 C308 114 318 114 328 122" opacity="0.55"/>
    </g>
    <g fill="#4b3f37" opacity="0.75">
      <ellipse cx="280" cy="138" rx="7" ry="9"/>
      <ellipse cx="320" cy="138" rx="7" ry="9"/>
    </g>
    <path d="M300 146 C295 156 295 164 300 168 C305 164 305 156 300 146 Z" fill="#9b7460" opacity="0.45" stroke="none"/>
    <path d="M282 178 C294 190 306 190 318 178" fill="none" stroke="#7a5a4b" stroke-width="3" opacity="0.55" stroke-linecap="round"/>
  </g>
</svg>
